[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  VITE_API_URL = "https://ai-job-portal-98k6.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
